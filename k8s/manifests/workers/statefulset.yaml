apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workers
  namespace: bryzek-production
  labels:
    app: workers
    app.kubernetes.io/name: workers
spec:
  # Replicas held at 1 by deliberate deferral, NOT a storage constraint anymore:
  # the browser profile is now an ephemeral emptyDir (no RWO PVC to deadlock on),
  # and the worker re-logins every batch (it reads no session state back from
  # disk), so there is no cross-pod session affinity. Raising this to 3 for
  # concurrent crawls is a separate change that also relaxes the platform's
  # single-flight dispatch gate and grows the crawler node pool. See
  # ~/code/claude/plans/cr-worker-parallelism-design.md (Phase B).
  replicas: 1
  serviceName: workers
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
        app.kubernetes.io/name: workers
    spec:
      # Dedicated `tier: crawler` node pool so a Chromium scrape doesn't
      # compete with web traffic (tier: web) or backend jobs (tier: job).
      # Currently a single s-2vcpu-4gb node (pool-crawler-4gb) — bump pool
      # size or size class if the crawler queue grows.
      nodeSelector:
        tier: crawler
      # 90s gives an in-flight Chromium scrape time to finish + closeSession()
      # to flush profile state before SIGKILL. Tune up if scrapes get longer.
      terminationGracePeriodSeconds: 90
      containers:
        - name: workers
          image: registry.digitalocean.com/bryzek/workers:__IMAGE_TAG__
          # Image tags from `sem-info tag latest` are immutable semver, so
          # IfNotPresent is safe and avoids redundant registry pulls on restart.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
              protocol: TCP
          envFrom:
            - secretRef:
                name: workers-secrets
            - configMapRef:
                name: workers-config
                optional: true
          env:
            - name: PORT
              value: "8787"
          volumeMounts:
            - name: browser-profile
              mountPath: /app/browser-profile
          # Sized for actual Chromium-headful usage: ~250Mi idle, ~500-900Mi
          # during a scrape, ~1.2Gi observed peaks (3-year members batch on
          # picklejar, wrq-138672cd2b364b5a85c3c04157c027b1, 2026-05-12; a
          # sales_detail saveAsExcel export on bounce-malvern, 2026-07-07).
          # The request MUST cover the observed peak: a pod running above its
          # request is the kubelet's first eviction victim under node memory
          # pressure — on the old s-1vcpu-2gb node the pod hit 1056Mi against
          # an 800Mi request and was evicted mid-download, stranding the
          # invocation in Running until the platform's fallback expiry
          # (win-ab1cf891866448efbb4ec0a7bc48f165). The s-2vcpu-4gb node's
          # ~2.9Gi allocatable minus ~500Mi of system daemonsets leaves
          # ~2.5Gi schedulable: 1400Mi request covers the 1.2Gi peak, and
          # the 2Gi limit gives a heavy export headroom before OOMKill.
          resources:
            requests:
              cpu: 500m
              memory: 1400Mi
            limits:
              cpu: 1800m
              memory: 2Gi
          # Liveness is intentionally lenient: a Chromium scrape can saturate
          # the Node event loop for tens of seconds at a time. Failing here
          # restarts the pod mid-scrape. 60s * 5 = 5min before kill.
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # Ephemeral per-pod profile. The worker re-logins every batch and reads
        # no session/profile state back from disk, so nothing needs to survive a
        # pod restart. emptyDir persists across container restarts within the
        # pod's life (so Cloudflare-clearance warmth is kept while the pod runs)
        # and is cleared when the pod is removed. Replaces the RWO PVC that used
        # to pin replicas to 1.
        - name: browser-profile
          emptyDir: {}
