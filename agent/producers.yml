# Producer registry for `dev agent tick` (design §4.2).
#
# Producers CREATE work; the dispatcher DOES work. A producer is a cheap check,
# never the work itself, and it NEVER spawns Claude — where a check finds
# something, it files an issue and the expensive part happens as claimed work
# through the normal queue.
#
# This file is the ONLY place a schedule lives. The platform records run history
# and arbitrates ("has someone already started this run?") but has no notion of
# "due" — teaching it the grammar would mean a second copy of this registry that
# drifts from git.
#
# Schedule grammar — three spoken forms, no cron expressions:
#
#   every <n> <unit>              every 1 hour, every 30 minutes
#   daily at <time>               daily at 3:00am
#   weekly on <day> at <time>     weekly on monday at 2:00am
#
# `timezone` is declared once, as an IANA zone rather than an abbreviation.
# "3am EDT" names a fixed offset and would silently drift an hour every winter;
# America/New_York means 3:00am local year-round across both DST transitions.
#
# file_when:
#   check_fails   file when the check exits 1
#   always        file unconditionally (for a chore with no cheap check — the
#                 review IS the work). The only form that may omit `check`.
#   never         the check acts directly and files nothing. Must not carry an
#                 `issue` block.
#
# CHECK EXIT CODES ARE A CONTRACT:
#   0  clean, nothing to do
#   1  findings — file (or increment) the issue
#   >1 the check itself broke -> recorded as `check_failed`, never as `filed`
# A crashing check is not evidence of a problem in the thing being checked, and
# collapsing the two turns a broken producer into a nightly stream of bogus
# issues.
#
# `issue.body_file` is an OPTIONAL playbook that ships with the issue, resolved
# relative to `agent/` and appended to the filed body. Use it wherever the brief
# is longer than a title — without one the claiming session gets
# claude-issues/default-body.md and does generic triage. It is a file rather than
# an inline `body:` because these playbooks are shared: every weekly-review
# producer points at the same one, and inlining would mean a copy per repo that
# drifts the moment anyone edits one. Validated at PARSE time, so a typo'd path
# fails the next tick instead of surfacing a week later as an issue with no brief.
#
# `fingerprint` is the dedup key. A producer does not file while a NON-TERMINAL
# issue with the same fingerprint exists (anything other than verified or
# dismissed — `fixed` included, which is what makes "don't re-file while a PR is
# open" free). Even on a double-fire the server increments occurrence_count
# instead of creating a duplicate.

timezone: America/New_York

producers:
  - key: invariants-platform
    schedule: every 1 hour
    check: dev invariants check --app platform
    file_when: check_fails
    issue:
      category: infrastructure
      severity: high
      title: Run dev invariants and fix as necessary
      fingerprint: invariants:platform

  - key: codegen-sync
    schedule: daily at 3:00am
    check: dev codegen sync --check
    file_when: check_fails
    issue:
      category: infrastructure
      title: Sync generated code
      fingerprint: codegen:sync

  # Reconciles directly and files nothing. This is the scheduled backstop for
  # "the agent died after opening a PR but before recording `fixed`" — the merge
  # webhook covers the merged case, this covers the rest. Three independent
  # closing paths, none load-bearing alone (design §4.1.2).
  - key: issue-reconcile
    schedule: every 30 minutes
    check: dev issues reconcile --apply
    file_when: never

  # ---- weekly per-repo code review -------------------------------------------
  #
  # One producer per repo, each filing an issue whose body IS the review playbook
  # (agent/bodies/weekly-review.md). `file_when: always` because no cheap check
  # exists — the review IS the work.
  #
  # These replace the openclaw cron jobs `weekly-review-*`, which ran the review
  # inline at 2am. The schedules below are those cron jobs' schedules, preserved.
  # The one behavioral difference is WHEN the work happens: a producer files, and
  # the review runs when a runner claims the issue. That is the point — the run
  # gets the queue's history, mutual exclusion and retry instead of a fire-and-
  # forget cron whose failures were invisible.
  #
  # `body_file` is what makes the port faithful. Without it the claiming session
  # falls back to claude-issues/default-body.md and does generic triage — which
  # is exactly what happened to ISS-360, the first run after the platform job was
  # ported without its playbook: it filed issues instead of shipping PRs.
  #
  # The fingerprint dedup means a repo does not re-file while its previous review
  # is still open. That is deliberate: reviews should not pile up behind a week
  # nobody worked.
  #
  # `clubaid`, `clubaid-admin`, `clubaid-app` and `clubaid-www` were the old repo
  # names. `clubaid` and `clubaid-app` BOTH now redirect to playbook-app, so the
  # old cron set reviewed that one repo twice a week; the two are collapsed here.

  - key: weekly-review-michaelbryzek
    schedule: weekly on sunday at 2:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: michaelbryzek"
      fingerprint: weekly-review:michaelbryzek
      body_file: bodies/weekly-review.md

  - key: weekly-review-acumen-ui
    schedule: weekly on sunday at 6:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: acumen-ui"
      fingerprint: weekly-review:acumen-ui
      body_file: bodies/weekly-review.md

  - key: weekly-review-platform
    schedule: weekly on monday at 2:00am
    file_when: always               # no cheap check exists — the review IS the work
    issue:
      category: infrastructure
      title: "Weekly code review: platform"
      fingerprint: weekly-review:platform
      body_file: bodies/weekly-review.md

  - key: weekly-review-playbook-app
    schedule: weekly on tuesday at 2:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: playbook-app"
      fingerprint: weekly-review:playbook-app
      body_file: bodies/weekly-review.md

  - key: weekly-review-rallyd
    schedule: weekly on wednesday at 2:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: rallyd"
      fingerprint: weekly-review:rallyd
      body_file: bodies/weekly-review.md

  - key: weekly-review-playbook-admin
    schedule: weekly on wednesday at 4:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: playbook-admin"
      fingerprint: weekly-review:playbook-admin
      body_file: bodies/weekly-review.md

  - key: weekly-review-apibuilder-ui
    schedule: weekly on wednesday at 6:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: apibuilder-ui"
      fingerprint: weekly-review:apibuilder-ui
      body_file: bodies/weekly-review.md

  - key: weekly-review-acumen
    schedule: weekly on thursday at 2:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: acumen"
      fingerprint: weekly-review:acumen
      body_file: bodies/weekly-review.md

  - key: weekly-review-lakeviewsummit-ui
    schedule: weekly on thursday at 6:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: lakeviewsummit-ui"
      fingerprint: weekly-review:lakeviewsummit-ui
      body_file: bodies/weekly-review.md

  - key: weekly-review-playbook-www
    schedule: weekly on friday at 2:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: playbook-www"
      fingerprint: weekly-review:playbook-www
      body_file: bodies/weekly-review.md

  - key: weekly-review-hackathon
    schedule: weekly on friday at 4:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: hackathon"
      fingerprint: weekly-review:hackathon
      body_file: bodies/weekly-review.md

  - key: weekly-review-hoa-frontend
    schedule: weekly on saturday at 2:00am
    file_when: always
    issue:
      category: infrastructure
      title: "Weekly code review: hoa-frontend"
      fingerprint: weekly-review:hoa-frontend
      body_file: bodies/weekly-review.md

  # Retention is a producer, not a cron, so log purging gets the same history,
  # visibility and mutual exclusion as everything else on the tick (§4.3.1).
  - key: agent-gc
    schedule: daily at 4:00am
    check: dev agent gc
    file_when: never
