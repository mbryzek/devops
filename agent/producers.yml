  # ---- machine chores that act directly (ISS-395) -----------------------------
  #
  # Each of these was an openclaw cron whose prompt ran one command and parsed its
  # stdout into a morning-briefing status file. `file_when: never` is the right
  # shape — the command IS the work and there is nothing to file — so the status
  # file moved INTO the command (lib/briefing.rb). The code that knows what
  # happened now writes what happened, instead of a prose runbook re-deriving it
  # with a regex.
  #
  # Schedules are the crons' schedules, preserved.
  #
  # `aidirs-prune`, `docker-prune` and `agent-gc` USED TO BE HERE and are not
  # producers at all (ISS-520). Every producer, including a `file_when: never`
  # one, runs behind the daily compare-and-set in POST /agent/producers/:key/runs
  # — so with N runners exactly one machine won each lock per day. That is the
  # right arbitration for work whose output is an ISSUE (one issue for the fleet,
  # not N) and the wrong arbitration for work whose output is FREE DISK ON THE
  # MACHINE THAT RAN IT: N-1 machines never collected a log, never pruned a
  # feature dir and never pruned an image, invisibly, until a disk filled.
  #
  # They are now runner-local maintenance inside the tick — see
  # lib/agent/maintenance.rb — on each machine's own cadence, with no server run
  # and no lock, plus a disk-pressure trigger that does not wait for a schedule.
  # Every machine prunes itself; the platform's job is noticing when one stops,
  # which is the `agent_runner_maintenance_stale` invariant, not a lock.

  - key: browserslist-update
    schedule: weekly on monday at 4:13am
    check: dev browserslist update
    file_when: never

  # ---- chores that file for a claiming session --------------------------------

  # ISS-402. `api lint` across the spec-owning repos, FILED rather than run.
  #
  # This was a shell script that cloned, linted, branched, committed, pushed and
  # opened a PR, all inside a producer check. It worked, and it was still the
  # wrong half of the contract: a producer creates work, it does not do it. A
  # script opening PRs from inside the tick has no lease, no retry and no run to
  # look at — a week where the push failed looked exactly like a week with no
  # drift. As a filed issue it is a session that lints, judges what the linter
  # rewrote, and opens a PR per repo the normal way.
  #
  # `file_when: always`, not `check_fails`: "is there drift?" is not a cheap
  # question here. Answering it means a clone and a lint per repo — the whole
  # job — so a check would do the work twice and hold the tick's work lock while
  # it did. A quiet week costs one issue that closes itself out as "nothing to
  # do", which is the cheaper of the two.
  #
  # ISS-501 made it AN EPIC WITH ONE CHILD PER REPO, for the reason ISS-397 gave
  # the nightly upgrade the same shape: the week is N independent runs — N
  # clones, N lints, N PRs — and as one issue they shared one lease and one 4h
  # budget, so one wedged repo took the whole run and a failure in the fourth
  # repo hid the first three.
  #
  # `children.names` MUST stay equal to ApiLint::REPOS (devops/lib/api_lint.rb)
  # — asserted by test/test_agent_cron_migration.rb, so a spec-owning repo added
  # to one list and not the other fails the suite instead of silently never
  # being linted. `dependency` owns specs and is deliberately absent: it never
  # migrated off the legacy `.apibuilder/config`, so `api lint` cannot run there
  # at all. That exclusion is recorded, with its reason, in
  # ApiLint::UNSUPPORTED.
  #
  # The fingerprint asymmetry is deliberate and is the thing to leave alone. The
  # CHILDREN carry the dedup (`api-lint:<repo>`, UNDATED): a repo whose lint PR
  # is still open is not re-filed, and the others still run. Dating the children
  # too would file a second issue on top of that open PR every week. The EPIC's
  # own key is dated because an epic awaiting Mike's verification sits at
  # `deployed`, which is non-terminal for dedup — an undated one would hold the
  # weekly producer until he clicked verify.
  - key: api-lint
    schedule: weekly on wednesday at 3:30am
    file_when: always
    issue:
      type: epic
      category: infrastructure
      title: Weekly api lint cleanup across the spec-owning repos
      fingerprint: api-lint:weekly:{date}
      body_file: bodies/api-lint.md
      children:
        names: [platform, acumen, lib-ai]
        category: infrastructure
        title: "api lint cleanup: {child}"
        fingerprint: "api-lint:{child}"
        body_file: bodies/api-lint-repo.md

  # The scan is cheap and its verdict is its exit code; the FIX is a session's
  # work. That split is the whole producer contract, and it replaces the openclaw
  # cron's fire-and-forget `claude --print` dispatch, which nothing watched.
  - key: depsguard
    schedule: weekly on monday at 5:13am
    check: dev depsguard
    file_when: check_fails
    issue:
      category: infrastructure
      title: Fix failing supply-chain config checks
      fingerprint: depsguard:scan
      body_file: bodies/depsguard-fix.md

  # ---- nightly work that has no cheap check (ISS-397 through ISS-401) ---------
  #
  # `file_when: always`, like the weekly reviews: there is no cheap check because
  # the review IS the work. Each replaces an openclaw cron that launched a
  # detached `claude --print` and ended its turn — a fire-and-forget process with
  # a `timeout` as its only safety net. A lease, a heartbeat, a retry and a run
  # record are exactly what replaces that scaffolding, so none of it is ported.
  #
  # The 03:30 collision between slow-query-review and platform-memory-improvement
  # in the old cron set stops mattering here: producers file, they do not execute,
  # and the claim path decides what runs when.

  # ISS-397. Not a check: `dev dependencies upgrade` runs for hours, and a
  # producer's check runs INLINE in the tick with no timeout — putting it there
  # would hold the work lock for a quarter of a day and starve every other
  # producer and the claim path behind it.
  #
  # AN EPIC WITH ONE CHILD PER REPO, not one issue for the night. The run is
  # really six independent runs — six clones, six suites, six PRs — and as a
  # single issue one wedged repo took the whole night with it and there was one
  # lease and one 4h budget covering all of them. As children each repo gets its
  # own lease, its own retry, its own 4h budget and its own visible outcome, and
  # the epic is the one thing Mike verifies when they have all landed.
  #
  # `children.names` MUST stay equal to Dependencies::Updates::APPS — asserted by
  # test/test_agent_cron_migration.rb, so a repo added to the pipeline without a
  # child here fails the suite instead of silently never being upgraded.
  #
  # Dedup lives on the CHILDREN (`dependencies:upgrade:<repo>`, undated): a repo
  # whose last issue is still open is not re-filed, and the other five still run.
  # The epic's fingerprint is dated because an epic awaiting Mike's verification
  # is non-terminal, and an undated one would stop the nightly producer until he
  # clicked verify.
  - key: dependency-upgrade
    schedule: daily at 3:45am
    file_when: always
    issue:
      type: epic
      category: infrastructure
      title: Nightly dependency upgrades
      fingerprint: dependencies:upgrade:{date}
      body_file: bodies/dependency-upgrade.md
      children:
        names: [platform, acumen, lib-util, lib-query, lib-cipher, lib-ai]
        category: infrastructure
        title: "Dependency upgrades: {child}"
        fingerprint: dependencies:upgrade:{child}
        body_file: bodies/dependency-upgrade-app.md

  - key: daily-perf-prs
    schedule: daily at 3:03am
    file_when: always
    issue:
      category: improvement
      title: Daily slow-route review and fixes
      fingerprint: perf:daily-routes
      body_file: bodies/daily-perf-prs.md

  - key: slow-query-review
    schedule: daily at 3:30am
    file_when: always
    issue:
      category: improvement
      title: Daily platform slow-query review
      fingerprint: perf:slow-queries
      body_file: bodies/slow-query-review.md

  - key: platform-memory-improvement
    schedule: daily at 3:35am
    file_when: always
    issue:
      category: improvement
      title: Daily platform memory / OOM improvement
      fingerprint: perf:platform-memory
      body_file: bodies/platform-memory-improvement.md

  - key: daily-error-triage
    schedule: daily at 5:45am
    file_when: always
    issue:
      category: bug
      severity: high
      title: Daily production error and stability triage
      fingerprint: triage:daily-errors
      body_file: bodies/daily-error-triage.md

  # ISS-453. The autonomy ledger's first real consumer.
  #
  # `file_when: always` for the same reason the weekly reviews use it: deciding
  # whether a PR may merge means cloning it, rebasing it onto latest main and
  # running its suite — that IS the work, so a check would do all of it inline,
  # inside the tick, holding the work lock.
  #
  # Nothing here grants any authority. The session must ask the ledger before
  # every merge and may act only on `auto_approved`, and the workflow registers
  # at `dry_run` — so the first weeks of runs record what they would have merged
  # and merge nothing, which is the point. Mode, envelope and budget are set by a
  # human at /admin/autonomy/workflows/pr_auto_merge; a run that widened its own
  # envelope would have no envelope.
  #
  # 6:45am is deliberately after the nightly producers (3:03–5:45) have filed and
  # before the working day: PRs opened overnight are decided while nobody is
  # mid-review of them.
  - key: pr-auto-merge
    schedule: daily at 6:45am
    file_when: always
    issue:
      category: infrastructure
      title: Auto-merge review-ready PRs
      fingerprint: pr:auto-merge:{date}
      body_file: bodies/pr-auto-merge.md

  # ISS-508. The structural half of gap review: ISS-507 makes a session file what
  # it WORKED AROUND, this finds what no single run could see.
  #
  # A session sees one night, so a workaround it applied on each of the last
  # thirty is, from inside the run, just how the job is done. Lining a week of
  # runs up side by side is the whole job — a check that exits >1 files nothing
  # and is deliberately indistinguishable from a clean one, an issue that went
  # `fixed` on a PR that never merged looks closed from every angle but GitHub's,
  # and a producer that has stopped firing produces no rows at all.
  #
  # `file_when: always` for the same reason the weekly reviews use it: no cheap
  # check exists, because the review IS the work. Answering "is there a gap?"
  # means reading the run history and the issues, which is the job.
  #
  # Sunday 7:00am, after the Sunday weekly reviews (02:00, 06:00) and after
  # pr-auto-merge (06:45), so a week's PR decisions are already recorded when the
  # window is read.
  #
  # The fingerprint is DATED, unlike its weekly-review neighbours, and the
  # difference is deliberate. A weekly review closes out `fixed` against a PR with
  # an app and a baseline, so `issues reconcile` walks it to `deployed` and then
  # `verified` — terminal, and the producer files again. This one usually closes
  # out `fixed` against a document, which nothing advances automatically; at
  # `fixed` it is still non-terminal, so an undated key would hold this producer
  # forever after its first run. Silently. Which is precisely detector D5 —
  # a producer built to find dark producers has no business being one.
  #
  # NOTE for epic ISS-519: this is the 28th producer, added after that design was
  # written. It ports like every other row — registry entry to a platform row
  # (ISS-521), body file to a playbook row (ISS-523).
  - key: meta-review
    schedule: weekly on sunday at 7:00am
    file_when: always
    issue:
      category: infrastructure
      title: Weekly meta-review of producer runs and recent issues
      fingerprint: meta-review:weekly:{date}
      body_file: bodies/meta-review.md
