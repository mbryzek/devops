# The Scala variant of templates/ci/ci.yml (ISS-763) — platform, acumen, and
# anything else that runs sbt against a database.
#
# READ templates/ci/ci.yml FIRST: the three load-bearing properties (the job
# named `ci` is the lane's contract, every build runs inside `dev ci run`, and
# `clean:` comes from `dev ci clean-build`) are explained there and are unchanged
# here. What follows is only what sbt and a database add.
#
#   THE SESSION DATABASE IS NOT NEW MACHINERY. CI does exactly what every Claude
#   session already does: `claude-db start --app <app> --port "$(claude-db
#   next-port)"`, exporting CONF_DB_DEV_URL in the SAME shell invocation as sbt.
#   Never :5432 — that is Mike's own database and a CI job that reached it would
#   corrupt his data while looking green.
#
#   CAPTURE THE START ON ITS OWN LINE AND CHECK IT. A pipeline reports only its
#   LAST command's status, so a `claude-db start | grep | sed` that FAILED exits
#   0 with CONF_DB_DEV_URL unset — and unset means the shared :5432 (ISS-735).
#   That is why ci/build.sh below is a script with `set -euo pipefail` rather
#   than a chain in the YAML.
#
#   THE DATABASE IS STARTED INSIDE THE SLOT, not before it. `dev ci run` wraps
#   the whole script, so a job waiting for a slot is not also holding a Postgres
#   container and one of the machine's scarce ports.
#
#   THE HEAP IS THE MACHINE'S, NOT THE FLEET'S. platform needs ~12G and OOMs at
#   sbt's default, and the right number differs per box (ISS-753). Until that
#   lands, set it explicitly and size it against the machine you installed the
#   runner on — a 12G heap on a 24G Mac running two CI slots is an OOM waiting
#   for the second job.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `claude-db` keys its databases on this, so the cleanup step below can reclaim
  # exactly this job's containers and nobody else's. A CI job that leaked one
  # would hold a port from a range the whole box shares.
  CLAUDE_SESSION_ID: ci-${{ github.run_id }}-${{ github.job }}

jobs:
  build:
    runs-on: [self-hosted, fleet]
    # Generous, because a COLD build is ~8 minutes of compilation before a single
    # test runs and the nightly is always cold. A warm PR build is a fraction of
    # it — which is the entire argument for self-hosting.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # CHANGE ME. Shard by whatever is convenient — subproject, suite, tag.
        # The `ci` gate below aggregates them into the one check the lane reads,
        # so this list can change freely without touching the lane.
        shard: [all]
    steps:
      - name: preflight
        run: $HOME/code/devops/bin/dev ci preflight --needs docker,registry,database

      - name: checkout policy
        id: policy
        run: echo "clean=$($HOME/code/devops/bin/dev ci clean-build --event '${{ github.event_name }}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # On a pull request this preserves `target/` — zinc's incremental
          # analysis — which is the difference between an 8-minute build and a
          # short one. ~/.cache/coursier, ~/.ivy2 and ~/.sbt survive regardless:
          # they live outside the checkout and `dev ci install` creates them.
          clean: ${{ steps.policy.outputs.clean }}
          fetch-depth: 0

      - name: build
        # CHANGE ME — the repo's own script. It exists as a script rather than as
        # YAML for the pipeline-exit-status reason at the top of this file, and
        # it should look like:
        #
        #   #!/usr/bin/env bash
        #   set -euo pipefail
        #   db_out=$(claude-db start --app platform --port "$(claude-db next-port)")
        #   export CONF_DB_DEV_URL=$(printf '%s\n' "$db_out" | sed -n 's/^CONF_DB_DEV_URL=//p')
        #   [ -n "$CONF_DB_DEV_URL" ] || { echo "no CONF_DB_DEV_URL" >&2; exit 1; }
        #   sbt -J-Xmx12G "$@"
        #
        # Run only the subprojects the PR affects, failing OPEN to the full build
        # whenever the mapping cannot resolve a changed path (ISS-762).
        run: $HOME/code/devops/bin/dev ci run -- ./ci/build.sh ${{ matrix.shard }}

      - name: release the session database
        # ALWAYS, including on a cancelled run: the containers and host ports are
        # a machine-wide resource, and the hourly `claude-db gc` is a backstop for
        # what this misses rather than a substitute for it.
        if: always()
        run: $HOME/code/devops/bin/claude-db end

  ci:
    name: ci
    needs: [build]
    if: always()
    runs-on: [self-hosted, fleet]
    timeout-minutes: 5
    steps:
      - name: aggregate
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "shards: $RESULT"
          if [ "$RESULT" = "success" ]; then
            exit 0
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTE'
          ### `ci` is red

          Check the failing job above for a **CI INFRASTRUCTURE FAULT** annotation
          before reading the diff. If it is there, this red is the runner — a full
          disk, a dead Docker daemon, an expired DigitalOcean credential, or a box
          with no free CI slot — and it is not evidence about the branch. Fix the
          machine; the fault names the command.

          Otherwise it is the suite, and the diff is where to look.
          NOTE
          exit 1
